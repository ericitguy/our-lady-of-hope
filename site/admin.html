<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin | Our Lady of Hope Enterprise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header admin-header" id="siteHeader">
  <div class="container header-inner">
    <a href="admin.html" class="brand">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 40 40" width="30" height="30"><circle cx="20" cy="20" r="18.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M20 9c4 4.5 6.5 8.4 6.5 12a6.5 6.5 0 1 1-13 0c0-3.6 2.5-7.5 6.5-12Z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></span>
      <span class="brand-text"><strong>OLAH Admin</strong><small>Product Manager</small></span>
    </a>
    <div class="header-actions">
      <a href="index.html" class="btn btn-outline btn-sm">View Website</a>
    </div>
  </div>
</header>
<main class="admin-main container" id="main">
  <div class="admin-top">
    <h1 class="h2">Products</h1>
    <div class="admin-actions">
      <button class="btn btn-outline btn-sm" id="exportBtn" type="button">Export JSON</button>
      <label class="btn btn-outline btn-sm import-label">Import JSON<input type="file" id="importInput" accept="application/json" hidden></label>
      <button class="btn btn-solid btn-sm" id="newProductBtn" type="button">+ New Product</button>
    </div>
  </div>
  <p class="admin-note">Changes are saved to this browser (localStorage) and can be exported as <code>data.js</code> for the live site. For a CMS-connected build, this structure maps directly to the product schema.</p>

  <div class="admin-layout">
    <div class="admin-list-panel">
      <input type="search" id="adminSearch" class="admin-search" placeholder="Search products…" autocomplete="off">
      <ul class="admin-list" id="adminList"></ul>
    </div>

    <div class="admin-form-panel">
      <form id="productForm" autocomplete="off">
        <input type="hidden" id="pfId">
        <h2 class="h3" id="formTitle">New Product</h2>
        <div class="field-grid">
          <div class="field"><label for="pfName">Product name *</label><input id="pfName" required></div>
          <div class="field"><label for="pfSlug">Slug (URL) *</label><input id="pfSlug" required></div>
          <div class="field"><label for="pfCategory">Category *</label><select id="pfCategory" required></select></div>
          <div class="field"><label for="pfSizes">Available sizes (comma-separated)</label><input id="pfSizes" placeholder="e.g. 100ml, 250ml"></div>
          <div class="field field-full"><label for="pfImages">Image URLs (comma-separated)</label><input id="pfImages" placeholder="assets/products/product-01.jpg"></div>
          <div class="field field-full"><label for="pfShort">Short description *</label><textarea id="pfShort" rows="2" required></textarea></div>
          <div class="field field-full"><label for="pfFull">Full description *</label><textarea id="pfFull" rows="4" required></textarea></div>
          <div class="field field-full"><label for="pfIngredients">Ingredients (leave blank if not supplied)</label><textarea id="pfIngredients" rows="2"></textarea></div>
          <div class="field field-full"><label for="pfSpecs">Product specifications (one per line, e.g. “Form: Liquid”)</label><textarea id="pfSpecs" rows="3"></textarea></div>
          <div class="field"><label for="pfPackaging">Packaging</label><input id="pfPackaging"></div>
          <div class="field"><label for="pfUsage">Usage information (only if officially supplied)</label><textarea id="pfUsage" rows="2"></textarea></div>
          <div class="field"><label for="pfStorage">Storage information</label><input id="pfStorage"></div>
          <div class="field"><label for="pfAvailability">Availability</label><select id="pfAvailability"><option value="available">Available</option><option value="made-to-order">Made to order</option><option value="out-of-stock">Out of stock</option></select></div>
          <div class="field"><label for="pfSeoTitle">SEO title</label><input id="pfSeoTitle"></div>
          <div class="field field-full"><label for="pfSeoDesc">SEO description</label><input id="pfSeoDesc"></div>
        </div>
        <div class="checks-row">
          <label class="check"><input type="checkbox" id="pfFeatured"> Featured product</label>
          <label class="check"><input type="checkbox" id="pfNew"> New product</label>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-solid btn-sm">Save Product</button>
          <button type="button" class="btn btn-outline btn-sm" id="resetBtn">Clear Form</button>
          <button type="button" class="btn btn-danger btn-sm" id="deleteBtn" hidden>Delete</button>
        </div>
      </form>
    </div>
  </div>
</main>
<script src="js/data.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
